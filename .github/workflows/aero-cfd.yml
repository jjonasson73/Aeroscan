# AeroScan: kör rider+bike-caset (aero_case/ i repo-roten) på GitHub Actions
name: aero-cfd

on:
  workflow_dispatch:
    inputs:
      mesh:
        description: "quick ~0.6M (inga prismalager) | coarse ~1.2M | fine ~6M"
        type: choice
        options: [quick, coarse, fine]
        default: quick
      max_iterations:
        description: "Max iterationer (stoppar tidigare när CdA stabiliserats)"
        default: "1500"
      speed:
        description: "Hastighet [m/s]"
        default: "12.5"
      of_version:
        description: "OpenFOAM ESI-version (apt: openfoamXXXX-default)"
        default: "2506"

jobs:
  cfd:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: aero_case
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenFOAM
        working-directory: .
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y --no-install-recommends openfoam${{ inputs.of_version }}-default
          echo "OF_BASHRC=/usr/lib/openfoam/openfoam${{ inputs.of_version }}/etc/bashrc" >> $GITHUB_ENV
          echo "NP=$(nproc)" >> $GITHUB_ENV

      - name: Configure case
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          S=system/snappyHexMeshDict
          foamDictionary -entry numberOfSubdomains -set $NP system/decomposeParDict
          foamDictionary -entry endTime       -set ${{ inputs.max_iterations }} system/controlDict
          foamDictionary -entry writeInterval -set ${{ inputs.max_iterations }} system/controlDict
          U=${{ inputs.speed }}; OMEGA=$(python3 -c "print(round($U/0.336,3))")
          sed -i "s/^Uinlet .*/Uinlet          ($U 0 0);/; s/omega           [0-9.]*;/omega           $OMEGA;/" 0/U
          sed -i "s/magUInf         [0-9.]*;/magUInf         $U;/" system/controlDict
          case "${{ inputs.mesh }}" in
            quick|coarse)
              sed -i 's/level (5 6)/level (4 5)/; s/level 6;/level 5;/' $S
              sed -i 's/levels ((1E15 4))/levels ((1E15 3))/; s/levels ((1E15 3)); }   \/\/ 31 mm/levels ((1E15 2)); }/' $S ;;
          esac
          if [ "${{ inputs.mesh }}" = "quick" ]; then
            sed -i 's/^addLayers       true;/addLayers       false;/' $S          # Spalding-väggfunktion klarar hög y+
            sed -i 's/max (4.5 0.8 2.0)/max (2.5 0.7 1.8)/' $S                  # kortare vakbox
          fi
          grep -E "addLayers|level|wakeBox" $S

      - name: Restore cached mesh
        id: meshcache
        uses: actions/cache/restore@v4
        with:
          path: |
            aero_case/processor*/constant
            aero_case/constant/polyMesh
            aero_case/log.checkMesh
          key: mesh-${{ inputs.mesh }}-np${{ env.NP }}-${{ hashFiles('aero_case/geometry/rider.stl','aero_case/geometry/bike.stl','aero_case/geometry/wheel_*.stl','aero_case/system/snappyHexMeshDict','aero_case/system/blockMeshDict','aero_case/system/surfaceFeatureExtractDict') }}

      - name: Mesh
        if: steps.meshcache.outputs.cache-hit != 'true'
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allmesh
          grep -E "cells:|Mesh OK|Failed" log.checkMesh || true

      - name: Save mesh to cache
        if: steps.meshcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            aero_case/processor*/constant
            aero_case/constant/polyMesh
            aero_case/log.checkMesh
          key: ${{ steps.meshcache.outputs.cache-primary-key }}

      - name: Solve
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allsolve
          grep -i "runTimeControl\|End" log.simpleFoam | tail -n 3 || true

      - name: Reconstruct + surface VTK
        if: always()
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          reconstructParMesh -constant > log.reconstructParMesh 2>&1 || true
          reconstructPar -latestTime > log.reconstructPar 2>&1 || true
          foamToVTK -latestTime -no-internal -patches '(rider bike wheel_rear wheel_front)' > log.foamToVTK 2>&1 || true

      - name: CdA summary
        if: always()
        run: |
          echo "### ${{ inputs.mesh }}, ${{ inputs.speed }} m/s, ${NP} kärnor" >> $GITHUB_STEP_SUMMARY
          echo "| Del | CdA [m²] | std, sista 150 it | iterationer |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in postProcessing/CdA_*/0/coefficient.dat; do
            n=$(basename $(dirname $(dirname $f)))
            python3 -c "import sys,numpy as np; d=np.loadtxt(sys.argv[1],comments='#'); c=d[-150:,1]; print(f'| {sys.argv[2]} | {c.mean():.4f} | {c.std():.4f} | {int(d[-1,0])} |')" "$f" "$n" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aero-${{ inputs.mesh }}-${{ github.run_number }}
          path: |
            aero_case/postProcessing
            aero_case/log.*
            aero_case/VTK
          retention-days: 30
