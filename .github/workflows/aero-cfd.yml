# AeroScan: kör rider+bike-caset (aero_case/ i repo-roten) på GitHub Actions
name: aero-cfd

on:
  workflow_dispatch:
    inputs:
      mesh:
        description: "quick ~0.6M (inga prismalager) | coarse ~1.2M | fine ~6M"
        type: choice
        options: [quick, coarse, fine]
        default: quick
      max_iterations:
        description: "Max iterationer (stoppar tidigare när CdA stabiliserats)"
        default: "1500"
      speed:
        description: "Hastighet [m/s]"
        default: "12.5"
      of_version:
        description: "OpenFOAM ESI-version (apt: openfoamXXXX-default)"
        default: "2506"

jobs:
  cfd:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: aero_case
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenFOAM
        working-directory: .
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y --no-install-recommends openfoam${{ inputs.of_version }}-default
          echo "OF_BASHRC=/usr/lib/openfoam/openfoam${{ inputs.of_version }}/etc/bashrc" >> $GITHUB_ENV
          echo "NP=$(nproc)" >> $GITHUB_ENV

      - name: Configure case
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          S=system/snappyHexMeshDict
          foamDictionary -entry numberOfSubdomains -set $NP system/decomposeParDict
          foamDictionary -entry endTime       -set ${{ inputs.max_iterations }} system/controlDict
          foamDictionary -entry writeInterval -set ${{ inputs.max_iterations }} system/controlDict

          # U, the turbulence inlet (k, omega) and the wheel rotation all follow from the
          # one speed input; previously k and omega stayed pinned at their 12.5 m/s values.
          U=${{ inputs.speed }}
          read OMEGA TKE TOMEGA <<<"$(python3 tools/inlet_conditions.py $U)"
          foamDictionary -entry Uinlet    -set "($U 0 0)" 0/include/initialConditions
          foamDictionary -entry turbKE    -set "$TKE"     0/include/initialConditions
          foamDictionary -entry turbOmega -set "$TOMEGA"  0/include/initialConditions
          foamDictionary -entry boundaryField/wheel_rear/omega  -set "$OMEGA" 0/U
          foamDictionary -entry boundaryField/wheel_front/omega -set "$OMEGA" 0/U
          foamDictionary -entry functions/forceDefaults/magUInf -set "$U" system/controlDict

          # Mesh resolution. foamDictionary edits the dictionary structure, so these cannot
          # silently no-op the way a pattern-matching sed does when the file is reformatted.
          case "${{ inputs.mesh }}" in
            quick|coarse)
              for pat in rider bike wheel_rear wheel_front; do
                foamDictionary -entry castellatedMeshControls/refinementSurfaces/$pat/level -set "(4 5)" $S
              done
              foamDictionary -entry castellatedMeshControls/features -set \
                '({file "rider.eMesh"; level 5;} {file "bike.eMesh"; level 5;} {file "wheel_rear.eMesh"; level 5;} {file "wheel_front.eMesh"; level 5;})' $S
              foamDictionary -entry castellatedMeshControls/refinementRegions/nearBox/levels -set "((1E15 3))" $S
              foamDictionary -entry castellatedMeshControls/refinementRegions/wakeBox/levels -set "((1E15 2))" $S ;;
          esac
          if [ "${{ inputs.mesh }}" = "quick" ]; then
            foamDictionary -entry addLayers -set false $S                        # Spalding klarar hög y+
            foamDictionary -entry geometry/wakeBox/max -set "(2.5 0.7 1.8)" $S   # kortare vakbox
          fi

          echo "--- effective configuration ---"
          echo "U = $U m/s | k = $TKE | omega_inlet = $TOMEGA | omega_wheel = $OMEGA rad/s"
          for e in addLayers castellatedMeshControls/features \
                   castellatedMeshControls/refinementSurfaces/rider/level \
                   castellatedMeshControls/refinementRegions/nearBox/levels \
                   castellatedMeshControls/refinementRegions/wakeBox/levels \
                   geometry/wakeBox/max; do
            echo "$e = $(foamDictionary -entry $e -value $S | tr -d '\n')"
          done

      - name: Check case consistency
        run: |
          pip install --quiet trimesh numpy scipy
          python3 tools/check_case.py

      - name: Restore cached mesh
        id: meshcache
        uses: actions/cache/restore@v4
        with:
          path: |
            aero_case/processor*/constant
            aero_case/constant/polyMesh
            aero_case/log.checkMesh
          key: mesh-${{ inputs.mesh }}-np${{ env.NP }}-${{ hashFiles('aero_case/geometry/rider.stl','aero_case/geometry/bike.stl','aero_case/geometry/wheel_*.stl','aero_case/system/snappyHexMeshDict','aero_case/system/blockMeshDict','aero_case/system/surfaceFeatureExtractDict') }}

      - name: Mesh
        if: steps.meshcache.outputs.cache-hit != 'true'
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allmesh
          grep -E "cells:|Mesh OK|Failed" log.checkMesh || true

      - name: Save mesh to cache
        if: steps.meshcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            aero_case/processor*/constant
            aero_case/constant/polyMesh
            aero_case/log.checkMesh
          key: ${{ steps.meshcache.outputs.cache-primary-key }}

      - name: Solve
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allsolve
          grep -i "runTimeControl\|End" log.simpleFoam | tail -n 3 || true

      - name: Reconstruct + surface VTK
        if: always()
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          reconstructParMesh -constant > log.reconstructParMesh 2>&1 || true
          reconstructPar -latestTime > log.reconstructPar 2>&1 || true
          foamToVTK -latestTime -no-internal -patches '(rider bike wheel_rear wheel_front)' > log.foamToVTK 2>&1 || true

      - name: CdA summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.mesh }}, ${{ inputs.speed }} m/s, ${NP} kärnor"
            python3 tools/cda_summary.py 150
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aero-${{ inputs.mesh }}-${{ github.run_number }}
          path: |
            aero_case/postProcessing
            aero_case/log.*
            aero_case/VTK
          retention-days: 30
