# AeroScan: kör rider+bike-caset (aero_case/ i repo-roten) på GitHub Actions
name: aero-cfd

on:
  workflow_dispatch:
    inputs:
      mesh:
        description: "quick ~0.6M (inga prismalager) | coarse ~1.2M | fine ~6M"
        type: choice
        options: [quick, coarse, fine]
        default: quick
      max_iterations:
        description: "Max iterationer (stoppar tidigare när CdA stabiliserats)"
        default: "1500"
      speed:
        description: "Hastighet [m/s]"
        default: "12.5"
      of_version:
        description: "OpenFOAM ESI-version (apt: openfoamXXXX-default)"
        default: "2506"
      fit_param:
        description: "FIT-parameter att ändra (tomt = baseline)"
        default: ""
      fit_delta:
        description: "Ändringens storlek"
        default: ""

jobs:
  cfd:
    runs-on: ubuntu-24.04
    # OpenFOAM kommer färdigt i bilden. Se aero-yaw.yml för bakgrunden: apt-steget fällde
    # tre jobb, och en pinnad tagg skyddar dessutom mot att en patchrelease byter solver
    # mellan två körningar utan att synas i loggen.
    container:
      image: opencfd/openfoam-default:${{ inputs.of_version }}
      options: --user root
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: aero_case
    steps:
      # Före checkout finns aero_case inte, så arbetskatalogen måste överstyras här.
      # Apt-anropet går mot Ubuntus egna arkiv, inte dl.openfoam.com.
      - name: Container prerequisites
        working-directory: .
        timeout-minutes: 10
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-pip git ca-certificates

      - uses: actions/checkout@v4

      - name: Locate OpenFOAM
        run: bash tools/find_openfoam.sh

      - name: Build geometry
        run: |
          pip install --quiet --break-system-packages -r requirements.txt
          if [ -n "${{ inputs.fit_param }}" ]; then
            python3 build_model.py ${{ inputs.fit_param }}=${{ inputs.fit_delta }}
          else
            python3 build_model.py
          fi
          python3 tools/check_case.py

      - name: Configure case
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          bash tools/configure_case.sh "${{ inputs.mesh }}" "${{ inputs.speed }}" \
                                       "${{ inputs.max_iterations }}" "$NP"

      - name: Restore cached mesh
        id: meshcache
        uses: actions/cache/restore@v4
        with:
          path: |
            aero_case/processor*/constant
            aero_case/constant/polyMesh
            aero_case/log.checkMesh
          key: mesh-${{ inputs.mesh }}-${{ inputs.fit_param }}${{ inputs.fit_delta }}-np${{ env.NP }}-${{ hashFiles('aero_case/geometry/rider.stl','aero_case/geometry/bike.stl','aero_case/geometry/wheel_*.stl','aero_case/system/snappyHexMeshDict','aero_case/system/blockMeshDict','aero_case/system/surfaceFeatureExtractDict') }}

      - name: Mesh
        if: steps.meshcache.outputs.cache-hit != 'true'
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allmesh
          grep -E "cells:|Mesh OK|Failed" log.checkMesh || true

      - name: Save mesh to cache
        if: steps.meshcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            aero_case/processor*/constant
            aero_case/constant/polyMesh
            aero_case/log.checkMesh
          key: ${{ steps.meshcache.outputs.cache-primary-key }}

      - name: Solve
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allsolve
          grep -i "runTimeControl\|End" log.simpleFoam | tail -n 3 || true

      - name: Reconstruct + surface VTK
        if: always()
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          reconstructParMesh -constant > log.reconstructParMesh 2>&1 || true
          reconstructPar -latestTime > log.reconstructPar 2>&1 || true
          foamToVTK -latestTime -no-internal -patches '(rider bike wheel_rear wheel_front)' > log.foamToVTK 2>&1 || true

      - name: CdA summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.mesh }}, ${{ inputs.speed }} m/s, ${NP} kärnor"
            python3 tools/cda_summary.py 150
          } | tee -a $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aero-${{ inputs.mesh }}-${{ github.run_number }}
          path: |
            aero_case/postProcessing
            aero_case/log.*
            aero_case/VTK
          retention-days: 30
