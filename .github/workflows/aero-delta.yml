# Go/no-go: kan pipelinen lösa upp en positionsändring, eller dränks den i nätbrus?
#
# Kör samma två positioner på två nätnivåer. Absolutvärdena kommer INTE att stämma mellan
# nivåerna - det är väntat för en trubbig kropp vid de här cellantalen. Frågan är om de är
# överens om SKILLNADEN. Är de det är deltat nätkonvergerat och positioner går att rangordna.
name: aero-delta

on:
  workflow_dispatch:
    inputs:
      fit:
        description: "FIT-ändringen, mellanslagsseparerad (t.ex. pad_drop_mm=-10 saddle_fore_mm=10)"
        default: "pad_drop_mm=-20"
      mesh:
        description: "Nätnivå"
        type: choice
        options: [quick, coarse, medium, fine]
        default: medium
      replicates:
        description: "Repliker per position. Identiska case reproduceras inte exakt, så flera repliker ger ett felstapel i stället för en siffra utan osäkerhet."
        type: choice
        options: ['[1]', '[1,2]', '[1,2,3]']
        default: '[1,2]' 
      max_iterations:
        default: "1500"
      speed:
        description: "Hastighet [m/s]"
        default: "12.5"
      of_version:
        default: "2506"

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(inputs.replicates) }}
        pos: [base, tuned]
    name: r${{ matrix.rep }}-${{ matrix.pos }}
    runs-on: ubuntu-24.04
    # OpenFOAM kommer färdigt i bilden. Se aero-yaw.yml för bakgrunden: apt-steget fällde
    # tre jobb, och en pinnad tagg skyddar dessutom mot att en patchrelease byter solver
    # mellan två körningar utan att synas i loggen.
    container:
      image: opencfd/openfoam-default:${{ inputs.of_version }}
      options: --user root
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: aero_case
    steps:
      # Före checkout finns aero_case inte, så arbetskatalogen måste överstyras här.
      # Apt-anropet går mot Ubuntus egna arkiv, inte dl.openfoam.com.
      - name: Container prerequisites
        working-directory: .
        timeout-minutes: 10
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-pip git ca-certificates

      - uses: actions/checkout@v4

      - name: Locate OpenFOAM
        run: bash tools/find_openfoam.sh

      - name: Build geometry
        # FIT går via env, inte direkt ${{ }}-interpolation in i skriptkroppen. Oquoterad
        # $FIT ordsplittas till flera argument, vilket är vad build_model.py vill ha, och
        # en okänd parameter avbryter där i stället för att tyst bygga baseline.
        env:
          FIT: ${{ inputs.fit }}
        run: |
          pip install --quiet --break-system-packages -r requirements.txt
          if [ "${{ matrix.pos }}" = "tuned" ]; then
            python3 build_model.py $FIT
          else
            python3 build_model.py
          fi
          python3 tools/check_case.py

      - name: Configure case
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          bash tools/configure_case.sh "${{ inputs.mesh }}" "${{ inputs.speed }}" \
                                       "${{ inputs.max_iterations }}" "$NP" fixed

      - name: Mesh and solve
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allmesh
          echo "--- nät ---"; grep -E "cells:|Mesh OK|Failed|\*\*\*" log.checkMesh || true
          bash Allsolve
          echo "--- lösare ---"; tail -n 6 log.simpleFoam || true

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -r postProcessing/CdA_* out/ 2>/dev/null || true
          cp model_info.json out/ 2>/dev/null || true
          cp log.* out/ 2>/dev/null || true
          # Ytfält och symmetrisnitt. VTK:n är ascii och komprimerar ca 5x, så den åker
          # med som tar-gz i stället för råa filer.
          if [ -d postProcessing/diagSurfaces ] || [ -d postProcessing/diagSlice ]; then
            tar czf out/fields.tar.gz postProcessing/diagSurfaces postProcessing/diagSlice \
                2>/dev/null || true
            echo "fältdata: $(du -h out/fields.tar.gz 2>/dev/null | cut -f1)"
          else
            echo "VARNING: ingen fältdata skrevs - diagSurfaces/diagSlice saknas"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r${{ matrix.rep }}-${{ matrix.pos }}
          path: aero_case/out
          retention-days: 30

  verdict:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run: { shell: bash, working-directory: aero_case }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: aero_case/results }
      - name: Delta report
        run: |
          pip install --quiet numpy
          # tee: utslaget måste synas i jobbloggen också, inte bara i sammanfattningen -
          # sammanfattningen går inte att läsa via API:et.
          {
            echo "## ${{ inputs.fit }} · ${{ inputs.mesh }} · ${{ inputs.speed }} m/s · repliker ${{ inputs.replicates }}"
            echo
            python3 tools/delta_report.py results 150 replik
          } | tee -a $GITHUB_STEP_SUMMARY
