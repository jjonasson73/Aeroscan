# Håller positionsvinsten i sidvind, eller bara i stilla luft?
#
# Ingen åker på en fast yaw-vinkel. Vinkeln följer av åkfart och vind, och vid 40 km/h ger
# redan 10 km/h sidvind omkring 14 grader. CdA kan skilja betydligt mer mellan 0 och 15
# grader än mellan två sittpositioner, så en position som vinner rakt fram vinner inte
# automatiskt på en blåsig dag. Svepet kör båda positionerna vid varje vinkel och räknar om
# resultatet till medeleffekt över ett varv.
#
# Yaw görs genom att VRIDA GEOMETRIN, inte inloppet. Vrids flödet i stället far vaken snett
# ut ur domänen - 10 m nedströms vid 15 grader är 2.7 m i sidled, bredare än domänens halva
# bredd - och sidorna kan inte längre vara symmetriplan. Med kroppen vriden ligger vaken kvar
# längs domänens långa axel.
name: aero-yaw

on:
  workflow_dispatch:
    inputs:
      fit:
        description: "FIT-ändringen som ska jämföras mot baseline"
        default: "pad_drop_mm=-10 saddle_fore_mm=10 saddle_up_mm=6"
      yaw_angles:
        description: "Vinklar [grader]. Cyklisten är inte spegelsymmetrisk (ett ben fram, kedja på höger sida), så båda tecknen är strängare - och dubbelt så många jobb."
        type: choice
        options:
          - '[0,5,10,15]'
          - '[0,10]'
          - '[0,5,10,15,20]'
          - '[-15,-10,-5,0,5,10,15]'
        default: '[0,5,10,15]'
      mesh:
        description: "Nätnivå"
        type: choice
        options: [quick, coarse, medium, fine]
        default: medium
      max_iterations:
        default: "1500"
      speed:
        description: "Hastighet [m/s] - luftens fart, densamma vid alla vinklar"
        default: "12.5"
      ride_speed_kmh:
        description: "Åkfart för omräkningen till CdA_eff"
        default: "40"
      of_version:
        default: "2506"

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        yaw: ${{ fromJSON(inputs.yaw_angles) }}
        pos: [base, tuned]
    name: y${{ matrix.yaw }}-${{ matrix.pos }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: aero_case
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenFOAM
        working-directory: .
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y --no-install-recommends openfoam${{ inputs.of_version }}-default
          echo "OF_BASHRC=/usr/lib/openfoam/openfoam${{ inputs.of_version }}/etc/bashrc" >> $GITHUB_ENV
          echo "NP=$(nproc)" >> $GITHUB_ENV

      - name: Build geometry
        # FIT går via env, inte direkt ${{ }}-interpolation in i skriptkroppen. Oquoterad
        # $FIT ordsplittas till flera argument, vilket är vad build_model.py vill ha.
        env:
          FIT: ${{ inputs.fit }}
          YAW: ${{ matrix.yaw }}
        run: |
          pip install --quiet -r requirements.txt
          if [ "${{ matrix.pos }}" = "tuned" ]; then
            python3 build_model.py $FIT "yaw_deg=$YAW"
          else
            python3 build_model.py "yaw_deg=$YAW"
          fi
          python3 tools/check_case.py

      - name: Configure case
        # "wide" ger breda förfiningsboxar vid ALLA vinklar, noll inräknad. En mesh som
        # ändrar sig med vinkeln lägger nätbrus rakt in i den trend svepet ska mäta.
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          bash tools/configure_case.sh "${{ inputs.mesh }}" "${{ inputs.speed }}" \
                                       "${{ inputs.max_iterations }}" "$NP" fixed wide
          echo "--- efter konfiguration ---"
          python3 tools/check_case.py

      - name: Mesh and solve
        run: |
          set +eu; source "$OF_BASHRC"; set -e
          export OMPI_MCA_rmaps_base_oversubscribe=1
          bash Allmesh
          echo "--- nät ---"; grep -E "cells:|Mesh OK|Failed|\*\*\*" log.checkMesh || true
          bash Allsolve
          echo "--- lösare ---"; tail -n 6 log.simpleFoam || true

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -r postProcessing/CdA_* out/ 2>/dev/null || true
          cp model_info.json out/ 2>/dev/null || true
          cp log.* out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y${{ matrix.yaw }}-${{ matrix.pos }}
          path: aero_case/out
          retention-days: 30

  verdict:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run: { shell: bash, working-directory: aero_case }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: aero_case/results }
      - name: Yaw report
        run: |
          pip install --quiet numpy
          # tee: utslaget måste synas i jobbloggen också - sammanfattningen går inte att
          # läsa via API:et.
          {
            echo "## ${{ inputs.fit }} · yaw ${{ inputs.yaw_angles }} · ${{ inputs.mesh }} · ${{ inputs.speed }} m/s"
            echo
            # 400 iterationers fönster, inte 150. Vid yaw svänger kraften och ett kort
            # fönster ger ett stickprov ur svängningen i stället för ett medelvärde.
            python3 tools/yaw_report.py results 400 "${{ inputs.ride_speed_kmh }}"
          } | tee -a $GITHUB_STEP_SUMMARY
